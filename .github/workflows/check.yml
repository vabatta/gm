name: check
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  flake-check:
    # macOS too, because its git spells file names differently
    # (core.precomposeUnicode) and its file system ignores Unicode form.
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix flake check -L
      # A release tag vX.Y.Z must match the version in package.nix, which the
      # binary and the man pages print.
      - if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        run: test "${GITHUB_REF_NAME#v}" = "$(nix eval --raw .#default.version)"
